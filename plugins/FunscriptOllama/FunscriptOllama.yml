name: Funscript Ollama
description: Experimental Ollama, ChatGPT CLI or Gemini CLI vision with Haven motion analysis, VR/POV, extra axes and chapter markers.
version: "0.3.1"
url: https://github.com/Thietmar1/StashIP-TV/tree/main/plugins/FunscriptOllama
exec:
  - python
  - "{pluginDir}/funscript_ollama.py"
interface: raw
tasks:
  - name: Test Selected AI Provider
    description: Test the selected provider with two synthetic images. ChatGPT/Gemini use the installed official CLI and an existing account login, without API keys.
    defaultArgs:
      mode: test_provider
  - name: Apply Recommended Generation Settings
    description: Apply the documented generation preset and 3-hour AI timeout. Preserve AI provider, account paths, models, server URL, tag names and marker preferences. Reload settings afterwards.
    defaultArgs:
      mode: apply_recommended
  - name: Test Ollama Connection
    description: Check the configured model and run a small synthetic image request. No library video is sent.
    defaultArgs:
      mode: test_connection
  - name: Process Tagged Scenes
    description: Process scenes tagged FunscriptOllama_Process, sequentially. Existing scripts are preserved by default.
    defaultArgs:
      mode: process_scenes
  - name: Import Chapters From Tagged Scenes
    description: Import metadata.chapters from existing sidecars of queued scenes. Does not call Ollama or change script files.
    defaultArgs:
      mode: import_chapters
  - name: Import Chapters From All Scenes
    description: Scan all scene file paths for primary funscripts and import missing chapter markers. Existing markers are preserved.
    defaultArgs:
      mode: import_all_chapters
settings:
  ai_provider:
    displayName: AI Provider
    description: "ollama (default), chatgpt_cli (official Codex CLI with ChatGPT login), or gemini_cli (official Gemini CLI with Google login). CLI providers send selected frames to the cloud and consume account quotas; no API-key fallback."
    type: STRING
  codex_path:
    displayName: ChatGPT Codex CLI Path
    description: "Default: codex from PATH. Alternatively an absolute executable path, without extra arguments. Install the official @openai/codex CLI in the same runtime as Stash."
    type: STRING
  codex_model:
    displayName: ChatGPT CLI Model
    description: "Empty: CLI account default. Optional exact model supported by your ChatGPT/Codex account, with image inputs. Independent of Ollama Model."
    type: STRING
  gemini_path:
    displayName: Gemini CLI Path
    description: "Default: gemini from PATH. Alternatively an absolute executable path, without extra arguments. Install the official @google/gemini-cli CLI in the Stash runtime."
    type: STRING
  gemini_model:
    displayName: Gemini CLI Model
    description: "Empty: CLI account default. Optional image-capable model or alias available to your Google account. Independent of Ollama Model."
    type: STRING
  cli_account_dir:
    displayName: CLI Account Directory
    description: "Optional absolute persistent folder. Codex uses <folder>/codex; Gemini uses <folder>/gemini/.gemini. Empty: CLI's normal account home. Complete login manually under the Stash service/container account; see README."
    type: STRING
  engine:
    displayName: Processing Engine
    description: "ollama_haven (default, selected AI region plus Haven radial flow), ollama (selected AI plus directional flow), or haven (local motion only, no AI provider). Legacy mode names are retained."
    type: STRING
  ollama_url:
    displayName: Ollama URL
    description: "Default: http://192.168.178.16:11434. Reachable from the Stash process/container; no /api/chat suffix."
    type: STRING
  model:
    displayName: Ollama Model
    description: "Default: qwen3-vl:8b-instruct. Must already be installed in Ollama."
    type: STRING
  trigger_tag:
    displayName: Queue Tag
    description: "Default: FunscriptOllama_Process. Kept on failures so processing can be retried."
    type: STRING
  complete_tag:
    displayName: Completion Tag
    description: "Default: FunscriptOllama_Complete."
    type: STRING
  error_tag:
    displayName: Error Tag
    description: "Default: FunscriptOllama_Error."
    type: STRING
  analysis_fps:
    displayName: Analysis Frames Per Second
    description: "Default: 15; range 2–30. OpenCV measures movement at this rate, not Ollama."
    type: NUMBER
  roi_interval:
    displayName: AI Region Refresh Seconds
    description: "Default: 30; range 2–120. Each refresh sends two sampled frames to the selected AI provider."
    type: NUMBER
  timeout_seconds:
    displayName: AI Request Timeout Seconds
    description: "Default: 10800 seconds (3 hours); range 10–10800. Wait for the complete response per Ollama request or CLI image invocation, not per video. CLI version/login checks use 30 seconds."
    type: NUMBER
  max_speed:
    displayName: Maximum Position Change Per Second
    description: "Default: 150; range 10–500 position units/second. Output values range from 0 to 100."
    type: NUMBER
  overwrite:
    displayName: Overwrite Existing Funscript
    description: "Default: off. When enabled, first preserve the previous file in a uniquely named backup."
    type: BOOLEAN
  threads:
    displayName: Motion Worker Threads
    description: "Default: 2; integer 1–32. Optical-flow workers; does not configure Ollama threads."
    type: NUMBER
  decoder_threads:
    displayName: Video Decoder Threads
    description: "Default: 1; integer 1–16. Limits FFmpeg decoder threads and associated full-resolution buffers. Separate from optical-flow workers; lower values help on memory-limited hosts."
    type: NUMBER
  batch_size:
    displayName: Maximum Queued Frame Pairs
    description: "Default: 32; integer 1–3000. Bounds optical-flow work waiting in memory. Higher values require more RAM."
    type: NUMBER
  detrend_window:
    displayName: Detrend Window Seconds
    description: "Default: 2; range 1–10. Removes slow drift from measured motion."
    type: NUMBER
  norm_window:
    displayName: Normalization Window Seconds
    description: "Default: 4; range 1–10. Local motion range calibration."
    type: NUMBER
  keyframe_reduction:
    displayName: Reduce Keyframes
    description: "Default: on. Keep direction changes instead of every measured point."
    type: BOOLEAN
  pov_mode:
    displayName: POV Mode
    description: "Default: off. Use Haven radial flow with a bottom-center motion origin inside the selected region."
    type: BOOLEAN
  balance_global:
    displayName: Balance Global Motion
    description: "Default: on. Directional mode subtracts background translation; radial mode uses Haven weighting."
    type: BOOLEAN
  vr_auto:
    displayName: Detect VR Tags
    description: "Default: on. Apply the configured VR crop when a scene has one of the VR Tags."
    type: BOOLEAN
  vr_tags:
    displayName: VR Tags
    description: "Default: VR,Virtual Reality,180°,360°. Comma-separated, case-insensitive."
    type: STRING
  vr_layout:
    displayName: VR Layout
    description: "sbs (default, left eye), haven (lower-left quarter), tb (top eye), mono (no crop). Select the actual layout of detected VR scenes."
    type: STRING
  multi_axis:
    displayName: Generate Additional Axes
    description: "Default: off. Generate surge, sway, twist, roll and pitch sidecars using Haven's activity-correlated noise."
    type: BOOLEAN
  multi_axis_intensity:
    displayName: Additional Axis Intensity
    description: "Default: 5; range 0–10. Scales generated secondary movement."
    type: NUMBER
  random_speed:
    displayName: Additional Axis Variation Speed
    description: "Default: 3; range 0–10. Time scale of generated noise; secondary axes are not measured 3D motion."
    type: NUMBER
  smart_limit:
    displayName: Limit Additional Axes By Activity
    description: "Default: on. Scale secondary movement by primary-axis activity."
    type: BOOLEAN
  auto_home_delay:
    displayName: Auto Home Delay Seconds
    description: "Default: 1; range 0–10. Minimum idle period before secondary-axis centering."
    type: NUMBER
  auto_home_duration:
    displayName: Auto Home Duration Seconds
    description: "Default: 1; range 0–10. Centering duration; zero selects immediate centering."
    type: NUMBER
  import_chapters:
    displayName: Automatically Import Chapter Markers
    description: "Default: on. Import metadata.chapters after processing or when preserving an existing script. Never delete existing markers."
    type: BOOLEAN
  export_chapters:
    displayName: Export Stash Markers As Chapters
    description: "Default: on. Include existing Stash markers in generated primary scripts and preserve old sidecar chapters on overwrite."
    type: BOOLEAN
  marker_tolerance:
    displayName: Marker Duplicate Tolerance Seconds
    description: "Default: 0.25; range 0–15. Matching title/tag and time are skipped; existing markers are never updated."
    type: NUMBER
  add_marker:
    displayName: Add Completion Marker
    description: "Default: off. Add Funscript Generated at zero seconds, using the Funscript tag."
    type: BOOLEAN
