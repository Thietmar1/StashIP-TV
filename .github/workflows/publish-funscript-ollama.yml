name: Test and publish Funscript Ollama

on:
  push:
    branches: [main]
    paths:
      - 'plugins/FunscriptOllama/**'
      - 'tools/package_funscript_ollama.py'
      - '.github/workflows/publish-funscript-ollama.yml'
      - 'LICENCE'
  pull_request:
    paths:
      - 'plugins/FunscriptOllama/**'
      - 'tools/package_funscript_ollama.py'
      - '.github/workflows/publish-funscript-ollama.yml'
      - 'LICENCE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funscript-ollama-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: plugins/FunscriptOllama/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r plugins/FunscriptOllama/requirements.txt
      - name: Test HTTP, video processing and Stash workflow
        run: python -m unittest discover -s plugins/FunscriptOllama/tests -v
      - name: Validate installable package
        run: python tools/package_funscript_ollama.py --output-dir dist --revision ci --check

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build package
        run: python tools/package_funscript_ollama.py --output-dir dist --revision "${GITHUB_SHA::12}" --check
      - name: Publish separate plugin source
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/funscript-ollama > /dev/null; then
            git fetch origin funscript-ollama:refs/remotes/origin/funscript-ollama
            git worktree add install-source -b publish-funscript origin/funscript-ollama
          else
            git worktree add --detach install-source HEAD
            git -C install-source checkout --orphan publish-funscript
            git -C install-source rm -r --cached .
          fi
          cp dist/index.yml dist/FunscriptOllama.zip install-source/
          cd install-source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.yml FunscriptOllama.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Funscript Ollama plugin package'
          git push origin HEAD:refs/heads/funscript-ollama
