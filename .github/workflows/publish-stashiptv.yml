name: Test and publish StashIP-TV

on:
  push:
    branches: [main]
    paths:
      - 'plugins/StashIP-TV/**'
      - 'tools/package_stashiptv.py'
      - '.github/workflows/publish-stashiptv.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'plugins/StashIP-TV/**'
      - 'tools/package_stashiptv.py'
      - '.github/workflows/publish-stashiptv.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stashiptv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/StashIP-TV/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux test FFmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Windows test FFmpeg
        if: runner.os == 'Windows'
        run: python -m pip install imageio-ffmpeg==0.6.0
      - name: Configure Linux real-media tests
        if: runner.os == 'Linux'
        run: echo 'FFMPEG_TEST_PATH=/usr/bin/ffmpeg' >> "$GITHUB_ENV"
      - name: Configure Windows real-media tests
        if: runner.os == 'Windows'
        run: python -c "import os,imageio_ffmpeg; f=open(os.environ['GITHUB_ENV'],'a',encoding='utf-8'); f.write('FFMPEG_TEST_PATH='+imageio_ffmpeg.get_ffmpeg_exe()+'\n'); f.close()"
      - name: Install dependencies
        working-directory: plugins/StashIP-TV
        run: npm ci
      - name: Test browser and shared logic
        working-directory: plugins/StashIP-TV
        run: npm test -- --runInBand --silent
      - name: Test packaged server, plugin tasks and real FFmpeg
        working-directory: plugins/StashIP-TV
        run: npm run test:iptv
      - name: Validate package
        run: python tools/package_stashiptv.py --output-dir dist --revision ci --check

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/StashIP-TV/package-lock.json
      - name: Build
        working-directory: plugins/StashIP-TV
        run: npm ci && npm run build
      - name: Package plugin and stable Stash index
        run: python3 tools/package_stashiptv.py --output-dir dist --revision "${GITHUB_SHA::12}" --check
      - uses: actions/checkout@v4
        with:
          ref: tvguide-iptv
          path: install-source
      - name: Update install source
        run: |
          cp dist/index.yml dist/StashIP-TV.zip install-source/
          cd install-source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.yml StashIP-TV.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish StashIP-TV plugin package'
          git push origin HEAD:tvguide-iptv
