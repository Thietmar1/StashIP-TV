name: Test and publish StashIP-TV

on:
  push:
    branches: [main]
    paths:
      - 'plugins/StashIP-TV/**'
      - 'plugins/FunscriptOllama/**'
      - 'plugins/intifacesyncer/**'
      - 'tools/package_stashiptv.py'
      - 'tools/package_funscript_ollama.py'
      - 'tools/package_intifacesyncer.py'
      - 'tools/package_catalog.py'
      - '.github/workflows/publish-stashiptv.yml'
      - 'README.md'
      - 'LICENCE'
  pull_request:
    paths:
      - 'plugins/StashIP-TV/**'
      - 'plugins/FunscriptOllama/**'
      - 'plugins/intifacesyncer/**'
      - 'tools/package_stashiptv.py'
      - 'tools/package_funscript_ollama.py'
      - 'tools/package_intifacesyncer.py'
      - 'tools/package_catalog.py'
      - '.github/workflows/publish-stashiptv.yml'
      - 'README.md'
      - 'LICENCE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stashiptv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/StashIP-TV/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux test FFmpeg
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
      - name: Install Windows test FFmpeg
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python -m pip install imageio-ffmpeg==0.6.0
      - name: Configure Linux real-media tests
        if: runner.os == 'Linux'
        run: echo "FFMPEG_TEST_PATH=$(command -v ffmpeg)" >> "$GITHUB_ENV"
      - name: Configure Windows real-media tests
        if: runner.os == 'Windows'
        run: python -c "import os,imageio_ffmpeg; f=open(os.environ['GITHUB_ENV'],'a',encoding='utf-8'); f.write('FFMPEG_TEST_PATH='+imageio_ffmpeg.get_ffmpeg_exe()+'\n'); f.close()"
      - name: Install dependencies
        working-directory: plugins/StashIP-TV
        run: npm ci
      - name: Test browser and shared logic
        working-directory: plugins/StashIP-TV
        run: npm test -- --runInBand --silent
      - name: Test packaged server, plugin tasks and real FFmpeg
        working-directory: plugins/StashIP-TV
        run: npm run test:iptv
      - name: Validate package
        run: python tools/package_catalog.py --output-dir dist --revision ci --check

  test_funscript:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: plugins/FunscriptOllama/requirements.txt
      - name: Install Funscript dependencies
        run: python -m pip install -r plugins/FunscriptOllama/requirements.txt
      - name: Test Ollama, Haven, VR, multi-axis and chapters
        run: python -m unittest discover -s plugins/FunscriptOllama/tests -v
      - name: Validate Funscript package
        run: python tools/package_funscript_ollama.py --output-dir dist --revision ci --check

  test_intiface:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Intiface test dependencies
        run: python -m pip install -r plugins/intifacesyncer/requirements-test.txt
      - name: Test Intiface vibration engine
        run: python plugins/intifacesyncer/test_vibe.py
      - name: Test Intiface bridge and Stash connection
        run: python plugins/intifacesyncer/test_bridge.py
      - name: Check Intiface Sync JavaScript syntax
        run: node --check plugins/intifacesyncer/IntifaceSync.js
      - name: Validate Intiface Sync package and Python syntax
        run: python tools/package_intifacesyncer.py --output-dir dist --revision ci --check

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, test_funscript, test_intiface]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/StashIP-TV/package-lock.json
      - name: Build
        working-directory: plugins/StashIP-TV
        run: npm ci && npm run build
      - name: Package all plugins and shared Stash index
        run: python3 tools/package_catalog.py --output-dir dist --revision "${GITHUB_SHA::12}" --check
      - name: Update shared source and compatible Funscript source
        run: |
          publish_source() {
            branch="$1"; folder="$2"; index="$3"; shift 3
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null; then
              git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
              git worktree add "$folder" -b "publish-$branch" "origin/$branch"
            else
              git worktree add --detach "$folder" HEAD
              git -C "$folder" checkout --orphan "publish-$branch"
              git -C "$folder" rm -r --cached .
            fi
            cp "$index" "$folder/index.yml"
            cp "$@" "$folder/"
            (
              cd "$folder"
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add index.yml ./*.zip
              if git diff --cached --quiet; then exit 0; fi
              git commit -m 'Publish Stash plugin catalog'
              git push origin "HEAD:refs/heads/$branch"
            )
          }
          publish_source tvguide-iptv install-source dist/index.yml dist/StashIP-TV.zip dist/FunscriptOllama.zip dist/IntifaceSync.zip
          publish_source funscript-ollama legacy-install-source dist/funscript/index.yml dist/FunscriptOllama.zip
