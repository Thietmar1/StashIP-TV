name: Publish installable TVGuide plugin

on:
  push:
    branches: [main]
    paths:
      - 'plugins/TVGuide/**'
      - 'tools/package_tvguide.py'
      - '.github/workflows/publish-tvguide.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-tvguide
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/TVGuide/package-lock.json
      - name: Install and build
        working-directory: plugins/TVGuide
        run: npm ci && npm run test:iptv
      - name: Package plugin and Stash index
        run: python3 tools/package_tvguide.py --output-dir dist --revision "${GITHUB_SHA::12}"
      - name: Checkout install source
        uses: actions/checkout@v4
        with:
          ref: tvguide-iptv
          path: install-source
      - name: Update install source
        run: |
          cp dist/index.yml dist/TVGuide.zip install-source/
          cd install-source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.yml TVGuide.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish TVGuide plugin package'
          git push origin HEAD:tvguide-iptv
